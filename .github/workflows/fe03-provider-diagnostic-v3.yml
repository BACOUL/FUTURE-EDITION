name: FE03 provider diagnostic v3

on:
  push:
    branches: [fe03-provider-v3]

permissions:
  contents: read

jobs:
  diagnose-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fresh provider diagnostic
        shell: bash
        run: |
          set -o pipefail
          node benchmarks/fe03/run-provider-resolution-diagnostic-v3.mjs | tee fe03-provider-v3.log
