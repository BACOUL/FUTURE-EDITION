name: FE03 NHS feed diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official NHS post API
        run: |
          node --input-type=module - <<'NODE'
          const urls=[
            "https://www.england.nhs.uk/wp-json/wp/v2/posts/289793",
            "https://www.england.nhs.uk/wp-json/wp/v2/pages/289793"
          ];
          for(const url of urls){
            const r=await fetch(url,{headers:{"user-agent":"FutureEditionEvidence/0.1 (+https://github.com/BACOUL/FUTURE-EDITION)","accept":"application/json"}});
            const body=await r.text();
            console.log("NHS_API_DIAG",JSON.stringify({url,status:r.status,type:r.headers.get("content-type"),length:body.length,hasCopilot:body.includes("500,000 NHS staff"),hasTitle:body.includes("NHS accelerates artificial intelligence rollout"),head:body.slice(0,220)}));
          }
          NODE
