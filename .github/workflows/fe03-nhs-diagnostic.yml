name: FE03 NHS feed diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official NHS RSS
        run: |
          node --input-type=module - <<'NODE'
          const urls=[
            "https://www.england.nhs.uk/2026/07/feed/",
            "https://www.england.nhs.uk/2026/06/feed/",
            "https://www.england.nhs.uk/2026/01/feed/",
            "https://www.england.nhs.uk/midlands/2026/07/feed/",
            "https://www.england.nhs.uk/south/2026/02/feed/"
          ];
          for(const url of urls){
            const r=await fetch(url,{headers:{"user-agent":"FutureEditionEvidence/0.1 (+https://github.com/BACOUL/FUTURE-EDITION)","accept":"application/rss+xml,application/xml,text/xml"}});
            const body=await r.text();
            console.log("NHS_FEED_DIAG",JSON.stringify({url,status:r.status,type:r.headers.get("content-type"),length:body.length,hasCopilot:body.includes("Microsoft Copilot"),hasAI:body.toLowerCase().includes("artificial intelligence"),head:body.slice(0,180)}));
          }
          NODE
