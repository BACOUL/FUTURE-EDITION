name: FE06R Publish Bundle

on:
  push:
    branches: [fe06r-publish-bundle]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build FE06R
        run: |
          node pipeline/validate-data.mjs
          node pipeline/validate-schemas.mjs
          node pipeline/validate-relations.mjs
          node pipeline/build-graph.mjs
          node pipeline/build-site.mjs
          node pipeline/validate-output.mjs
      - name: Freeze generated dist on publish branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist unchanged"
          else
            git commit -m "build(FE-06R): freeze PageShare publish dist"
            git push origin HEAD:fe06r-publish-bundle
          fi
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: fe06r-dist
          path: dist/
          include-hidden-files: true
          retention-days: 7
