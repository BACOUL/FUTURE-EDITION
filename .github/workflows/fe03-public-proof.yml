name: FE03 public proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fe03-public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static FE-03 gates
        run: |
          node benchmarks/fe03/validate-collection-matrix.mjs
          node benchmarks/fe03/validate-acquisition-plan.mjs
          node benchmarks/fe03/validate-external.mjs benchmarks/fe03/external/dev-validation.seed.json
          node benchmarks/fe03/validate-claim-annotations.mjs
          node pipeline/test-fe03-core.mjs
          node pipeline/test-fe03-contracts.mjs
          node pipeline/test-fe03-resolver.mjs
          node pipeline/test-fe03-locators.mjs
          node pipeline/test-fe03-semantic-safety.mjs
          node pipeline/test-fe03-independence.mjs
          node pipeline/test-fe03-confirmation-gate.mjs
          node pipeline/test-fe03-crossref-integrity.mjs
          node pipeline/test-fe03-pubmed-integrity.mjs
          node pipeline/test-fe03-claim-linker.mjs
      - name: Diagnose official NHS HTML
        run: |
          node --input-type=module - <<'NODE'
          const url="https://www.england.nhs.uk/2026/07/nhs-accelerates-artificial-intelligence-rollout-to-cut-waiting-times-and-improve-care-for-millions/";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36","accept":"text/html,application/xhtml+xml"}});
          const body=await r.text();
          console.log("NHS_DIAG",JSON.stringify({status:r.status,url:r.url,type:r.headers.get("content-type"),length:body.length,head:body.slice(0,500)}));
          NODE
      - name: Live public source-resolution benchmark
        shell: bash
        run: |
          set -o pipefail
          node benchmarks/fe03/run-external-resolution.mjs --delay-ms=400 --enforce --output=fe03-resolution.json | tee fe03-resolution.log
      - name: Live public claim-to-evidence benchmark
        shell: bash
        run: |
          set -o pipefail
          node benchmarks/fe03/run-claim-linker.mjs --delay-ms=400 | tee fe03-claim.log
          grep -q 'gate_eligible=1' fe03-claim.log
